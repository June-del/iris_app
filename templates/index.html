<!DOCTYPE html>
<html>
<head>
    <title>Iris Flower Prediction</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Iris Flower Classifier</h2>
    <form action="/predict" method="post">
        <label>Sepal Length (cm):</label><input type="text" name="SepalLengthCm"><br>
        <label>Sepal Width (cm):</label><input type="text" name="SepalWidthCm"><br>
        <label>Petal Length (cm):</label><input type="text" name="PetalLengthCm"><br>
        <label>Petal Width (cm):</label><input type="text" name="PetalWidthCm"><br>
        <button type="submit">Predict</button>
    </form>
    <h3>{{ prediction_text }}</h3>
    {% if flower_image %}
        <img src="{{ flower_image }}" alt="Predicted Flower">
    {% endif %}
</body>
</html>
